name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify independent reproduction bundle
        run: python reproducibility/recompute.py
      - name: Replay paired confidence intervals
        run: python reproducibility/recompute_efficiency_ci.py
      - name: Run tests
        run: python -m pytest -q
