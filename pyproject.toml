[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "l20-pretraining-lab"
version = "0.2.0"
description = "Single-L20 language pretraining and evidence-backed multimodal research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["pretraining/tests", "tests"]
pythonpath = ["pretraining", "."]
addopts = "-ra"
