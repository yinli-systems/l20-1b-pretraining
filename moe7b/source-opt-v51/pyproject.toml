[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cvcr-moe-research"
version = "0.1.0"
description = "Evidence-gated CVCR mixture-of-experts pretraining research"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "torch>=2.11"]

[tool.setuptools.packages.find]
include = ["cvcr_moe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
